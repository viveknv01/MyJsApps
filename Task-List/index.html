<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Clipboard</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('task-list-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <a class="home-button" href="../index.html">Home</a>

  <div class="card">
    <div class="clip" aria-hidden="true"></div>
    <header>
      <h1>Personal Clipboard</h1>
      <p>Save text here. Open it on your other device.</p>
    </header>

    <label class="sr-only" for="taskText">Clipboard text</label>
    <textarea id="taskText" rows="10" placeholder="Paste text here…"></textarea>

    <div class="btn-grid">
      <button type="button" id="saveBtn" class="btn primary">Save</button>
      <button type="button" id="todayBtn" class="btn">Fetch</button>
      <button type="button" id="copyBtn" class="btn">Copy</button>
      <button type="button" id="whatsappBtn" class="btn">WhatsApp</button>
      <button type="button" id="sheetBtn" class="btn">Sheet</button>
    </div>

    <p id="status" class="status" role="status">Nothing saved for today</p>

    <details class="settings">
      <summary>Settings</summary>
      <button type="button" id="themeBtn" class="btn">Dark mode</button>
      <label for="workerUrl">Worker URL</label>
      <input id="workerUrl" type="url" autocomplete="off" />
      <label for="authToken">Token</label>
      <input id="authToken" type="password" autocomplete="off" />
      <button type="button" id="saveSettingsBtn" class="btn">Save settings</button>
    </details>
  </div>

  <script src="script.js"></script>
</body>
</html>
